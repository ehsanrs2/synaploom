name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Resolve lockfile
        run: uv lock

      - name: Bootstrap uv.lock on this migration branch
        if: github.event_name == 'pull_request' && github.head_ref == 'build/uv-migration'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: add uv lockfile"
            git push origin HEAD:build/uv-migration
          fi

      # The committed lock stays hardware-neutral. CI builds a CPU-only torch
      # environment with uv so GitHub runners do not download CUDA wheels.
      - name: Create CI environment
        run: uv venv --python 3.11

      - name: Install locked dev dependencies
        run: |
          uv export --locked --only-group dev --no-hashes --output-file /tmp/dev-requirements.txt
          uv pip install --python .venv/bin/python -r /tmp/dev-requirements.txt

      - name: Install CPU PyTorch
        run: uv pip install --python .venv/bin/python --torch-backend cpu "torch>=2.2"

      - name: Install SynapLoom
        run: uv pip install --python .venv/bin/python --editable . --no-deps

      - name: Run test suite
        run: uv run --no-sync pytest

      - name: Run M1.1 smoke
        run: uv run --no-sync python experiments/scripts/m1_1_smoke.py

      - name: Run M1.2 smoke
        run: uv run --no-sync python experiments/scripts/m1_2_synthetic_smoke.py

      - name: Run M1.3 protocol smoke
        run: uv run --no-sync python experiments/scripts/m1_3_protocol_smoke.py
