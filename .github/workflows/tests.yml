name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - run: pip install "numpy>=1.26" "pytest>=8"
      - run: pip install -e . --no-deps
      - run: pytest
      - run: python experiments/scripts/m1_1_smoke.py
      - run: python experiments/scripts/m1_2_synthetic_smoke.py
      - run: python experiments/scripts/m1_3_h1.py --dry-run
