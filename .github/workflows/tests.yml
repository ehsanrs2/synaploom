name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Resolve lockfile
        run: uv lock

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error

      - name: Sync project (CPU PyTorch)
        run: uv sync --locked --extra cpu

      - name: Run test suite
        run: uv run --locked --no-sync pytest

      - name: Run M1.1 smoke
        run: uv run --locked --no-sync python experiments/scripts/m1_1_smoke.py

      - name: Run M1.2 smoke
        run: uv run --locked --no-sync python experiments/scripts/m1_2_synthetic_smoke.py

      - name: Run M1.3 protocol smoke
        run: uv run --locked --no-sync python experiments/scripts/m1_3_protocol_smoke.py
