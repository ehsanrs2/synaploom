[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synaploom"
version = "0.1.0.dev0"
description = "Brain-inspired adaptive graph architecture for continual multimodal learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
vision = [
  "torchvision>=0.17",
]
cpu = [
  "torch>=2.2",
]

[dependency-groups]
dev = [
  "numpy>=1.26",
  "pytest>=8",
]

[tool.uv]
required-version = ">=0.12.0,<0.13"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
